kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: dotnet-bdd-sample
  labels:
    language: csharp
    framework: mstest
    tool: reqnroll
spec:
  config:
    environment:
      type: string
      default: demo
    filter:
      type: string
      default: "TestCategory!=Stale"
  content:
    git:
      uri: https://github.com/neuralnimbus22/dotnet-bdd-sample
      revision: main
  container:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    workingDir: /data/repo
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
  services:
    chrome:
      image: selenium/standalone-chrome:4.21.0-20240517
      logs: always
      readinessProbe:
        httpGet:
          path: /wd/hub/status
          port: 4444
        periodSeconds: 1
  steps:
    - name: Run the BDD scenarios
      container:
        env:
          - name: SELENIUM_URL
            value: "http://{{ services.chrome.0.ip }}:4444/wd/hub"
          - name: TEST_ENVIRONMENT
            value: "{{ config.environment }}"
          - name: ARTIFACTS_DIR
            value: /data/artifacts
      shell: >-
        dotnet test BddSample.Tests/BddSample.Tests.csproj
        --filter "{{ config.filter }}"
        --logger "junit;LogFilePath=/data/artifacts/junit-report.xml"
        --logger "console;verbosity=normal"
    - name: Save the report and screenshots
      condition: always
      artifacts:
        workingDir: /data/artifacts
        paths:
          - "**/*"
